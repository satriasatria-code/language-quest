<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Quest — Pixel Open World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#game{width:100vw;height:100vh;position:relative}
.ui{position:absolute;z-index:10}.card{background:rgba(5,12,25,.88);border:2px solid #334155;border-radius:13px;box-shadow:0 10px 35px #0008}
#hud{left:16px;top:16px;display:flex;gap:9px;align-items:center}.player-card{padding:9px 12px;width:230px}.name{font-weight:950;font-size:14px}.small{font-size:10px;color:#94a3b8}.bar{height:8px;background:#020617;border-radius:8px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee);width:0}
#stats{padding:10px 12px;font-size:12px;font-weight:900}#topright{right:16px;top:16px;display:flex;gap:7px}
button{font:inherit;color:#fff;background:#17243a;border:1px solid #475569;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:850}button:hover{background:#283957;border-color:#a78bfa}
#quest{left:50%;top:16px;transform:translateX(-50%);padding:8px 15px;min-width:285px;text-align:center}.quest-title{font-size:12px;font-weight:950}.quest-sub{font-size:10px;color:#94a3b8;margin-top:2px}
#hint{left:50%;bottom:16px;transform:translateX(-50%);padding:8px 13px;font-size:10px;white-space:nowrap;color:#cbd5e1}
#location{right:16px;bottom:16px;padding:8px 11px;font-size:10px;color:#94a3b8}
#dialog,#modal{position:absolute;inset:0;z-index:30;background:#020617b8;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px}
.panel{width:min(520px,95vw);background:#0f172a;border:2px solid #475569;border-radius:18px;padding:20px;box-shadow:0 30px 90px #0009}.panel h2{margin:0 0 7px}.panel p{font-size:13px;color:#cbd5e1;line-height:1.55}.panel-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.danger{background:#4c1d1d}.good{color:#6ee7b7}.bad{color:#fb7185}
#inventory{display:none;position:absolute;right:16px;top:65px;z-index:20;width:240px;padding:14px}.inv-title{font-weight:950;margin-bottom:9px}.item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e293b;font-size:11px}
#mobile{display:none;position:absolute;left:15px;bottom:55px;z-index:15;grid-template-columns:repeat(3,42px);gap:5px}.mkey{width:42px;height:42px;padding:0;opacity:.9}.up{grid-column:2}.down{grid-column:2}.left{grid-column:1}.right{grid-column:3}
@media(max-width:700px){#hud{left:9px;top:9px}.player-card{width:175px}.player-card .small{display:none}#stats{display:none}#quest{top:9px;min-width:230px}#topright{right:9px;top:57px}#hint{bottom:9px;display:none}#location{right:9px;bottom:9px}.panel{padding:16px}.choices{grid-template-columns:1fr!important}#mobile{display:grid}}
</style>
</head>
<body>
<div id="game">
<canvas id="world"></canvas>

<div id="hud" class="ui">
  <div class="card player-card">
    <div class="name">🧑 <span id="playerName">Adventurer</span></div>
    <div class="small">Level <span id="level">1</span> • <span id="title">Language Rookie</span></div>
    <div class="bar"><div class="fill" id="xpFill"></div></div>
    <div class="small" id="xpText">0 / 100 XP</div>
  </div>
  <div class="card" id="stats">💰 <span id="coins">100</span> &nbsp; 🎒 <span id="items">0</span> &nbsp; 🏆 <span id="done">0</span></div>
</div>

<div id="quest" class="ui card">
  <div class="quest-title" id="questTitle">🗺️ Main Quest</div>
  <div class="quest-sub" id="questSub">Temui Luna di Village.</div>
</div>

<div id="topright" class="ui">
  <button onclick="toggleInventory()">🎒 Inventory</button>
  <button onclick="showHelp()">❔ Help</button>
  <button onclick="resetGame()">↻ Reset</button>
</div>

<div id="inventory" class="ui card">
  <div class="inv-title">🎒 Inventory</div>
  <div class="item"><span>📜 Quest Scroll</span><b id="scrolls">1</b></div>
  <div class="item"><span>🧪 Energy Potion</span><b id="potions">0</b></div>
  <div class="item"><span>💎 Language Gem</span><b id="gems">0</b></div>
</div>

<div id="hint" class="ui card">WASD / Arrow Keys • E / Enter = Interact • Jelajahi dunia untuk menemukan quest</div>
<div id="location" class="ui card">🌎 Language Valley</div>

<div id="mobile">
<button class="mkey up" data-key="w">▲</button><button class="mkey left" data-key="a">◀</button>
<button class="mkey down" data-key="s">▼</button><button class="mkey right" data-key="d">▶</button>
</div>

<div id="dialog">
 <div class="panel">
  <h2 id="dialogTitle">NPC</h2><p id="dialogText"></p>
  <div class="panel-actions"><button onclick="closeDialog()">Tutup</button><button id="dialogAction" onclick="dialogAction()">Mulai Quest</button></div>
 </div>
</div>

<div id="modal">
 <div class="panel">
  <h2 id="modalTitle">📚 Quest</h2><p id="modalText"></p>
  <div id="choices" style="display:grid;grid-template-columns:1fr 1fr;gap:9px"></div>
  <div class="panel-actions"><button id="modalClose" onclick="closeModal()">Tutup</button></div>
 </div>
</div>
</div>

<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
const world={w:2400,h:1600}, cam={x:0,y:0};
const keys={}; let player={x:1170,y:810,speed:3.1,r:15};
let data=JSON.parse(localStorage.getItem('LQ_OPEN_WORLD')||'null')||{coins:100,xp:0,done:0,scrolls:1,potions:0,gems:0,quests:{}};

const zones=[
 {id:'village',name:'🏘️ Pixel Village',x:1050,y:650,w:330,h:270,color:'#8b6a48'},
 {id:'market',name:'🏪 Market Town',x:1660,y:500,w:330,h:260,color:'#7a513c'},
 {id:'library',name:'📚 Grand Library',x:420,y:460,w:300,h:250,color:'#594a7d'},
 {id:'castle',name:'🏰 Crystal Castle',x:1720,y:1100,w:370,h:270,color:'#596b7f'},
 {id:'forest',name:'🌲 Listening Forest',x:250,y:1050,w:470,h:330,color:'#416b46'}
];
const npcs=[
 {id:'luna',x:1080,y:600,emoji:'🧙',name:'Luna',role:'Language Guide',q:'vocab',color:'#a78bfa'},
 {id:'milo',x:1760,y:600,emoji:'🧑‍🍳',name:'Milo',role:'Market Chef',q:'sentence',color:'#f59e0b'},
 {id:'aria',x:570,y:410,emoji:'🧑‍🏫',name:'Aria',role:'Grammar Teacher',q:'grammar',color:'#22d3ee'},
 {id:'rex',x:1900,y:1040,emoji:'🛡️',name:'Rex',role:'Castle Guard',q:'boss',color:'#ef4444'},
 {id:'echo',x:470,y:1010,emoji:'🎧',name:'Echo',role:'Listening Guide',q:'listening',color:'#34d399'}
];
const trees=[];for(let i=0;i<130;i++){let x=80+Math.random()*2240,y=130+Math.random()*1380;if(x>900&&x<1450&&y>520&&y<980)continue;trees.push({x,y})}
const rocks=[];for(let i=0;i<45;i++)rocks.push({x:80+Math.random()*2240,y:120+Math.random()*1400});
const buildings=[...zones];

function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if((k==='e'||e.key==='Enter')&&!document.getElementById('dialog').style.display&&!document.getElementById('modal').style.display)interact()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.mkey').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.key]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.key]=false});

function save(){localStorage.setItem('LQ_OPEN_WORLD',JSON.stringify(data));updateHUD()}
function level(){return Math.floor(data.xp/100)+1}
function addReward(x,c,g=0){data.xp+=x;data.coins+=c;data.gems+=g;save()}
function updateHUD(){let lv=level(),base=(lv-1)*100,cur=data.xp-base;document.getElementById('level').textContent=lv;document.getElementById('xpText').textContent=cur+' / 100 XP';document.getElementById('xpFill').style.width=cur+'%';document.getElementById('coins').textContent=data.coins;document.getElementById('items').textContent=data.potions+data.gems;document.getElementById('done').textContent=data.done;document.getElementById('scrolls').textContent=data.scrolls;document.getElementById('potions').textContent=data.potions;document.getElementById('gems').textContent=data.gems;document.getElementById('title').textContent=lv<3?'Language Rookie':lv<6?'Word Explorer':lv<10?'Grammar Knight':'Language Master'}
updateHUD();

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestNPC(){let best=null,bd=90;for(const n of npcs){let d=dist(player,n);if(d<bd){best=n;bd=d}}return best}
function interact(){const n=nearestNPC();if(!n)return;openNPC(n)}
function openNPC(n){
 const done=data.quests[n.id];document.getElementById('dialogTitle').textContent=n.emoji+' '+n.name+' — '+n.role;
 document.getElementById('dialogText').textContent=done?'Quest ini sudah kamu selesaikan. Terima kasih! Kamu bisa menjelajah ke area lain.':npcIntro(n);
 document.getElementById('dialogAction').textContent=done?'Tutup':'⚔️ Ambil Quest';
 document.getElementById('dialogAction').onclick=done?closeDialog:()=>{closeDialog();startQuest(n)};
 document.getElementById('dialog').style.display='flex';
}
function npcIntro(n){return n.q==='vocab'?'Bantu aku belajar 1 kata baru! Pilih arti kata “Adventure”.':n.q==='sentence'?'Susun kata-kata ini menjadi kalimat bahasa Inggris yang benar.':n.q==='grammar'?'Tes grammar: pilih kalimat yang paling benar.':n.q==='listening'?'Dengarkan kata yang disebutkan, lalu pilih jawaban yang tepat.':'Boss Challenge! Buktikan kemampuan bahasa Inggris-mu.'}
function closeDialog(){document.getElementById('dialog').style.display='none'}

function startQuest(n){
 document.getElementById('modalTitle').textContent='📜 Quest: '+n.name;
 document.getElementById('modalText').textContent='';
 const box=document.getElementById('choices');box.innerHTML='';
 const q=questions[n.q];
 document.getElementById('modalClose').style.display='none';
 if(n.q==='listening'){
   document.getElementById('modalText').innerHTML='Tekan tombol 🔊 untuk mendengar kata, lalu pilih artinya.';
   let speak=document.createElement('button');speak.textContent='🔊 Play Audio';speak.onclick=()=>speakWord(q.word);box.appendChild(speak);
 }else document.getElementById('modalText').textContent=q.question;
 q.choices.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answerQuest(n,q,a);box.appendChild(b)});
 document.getElementById('modal').style.display='flex';
}
const questions={
 vocab:{question:'Apa arti “Adventure”?',choices:['Petualangan','Perabotan','Keberangkatan','Cuaca'],answer:'Petualangan',reward:50},
 sentence:{question:'Mana kalimat yang benar?',choices:['She goes to school every day.','She go to school every day.','She going school every day.','She gone to school every day.'],answer:'She goes to school every day.',reward:60},
 grammar:{question:'Pilih yang benar:',choices:['I am happy.','I is happy.','I are happy.','I be happy.'],answer:'I am happy.',reward:60},
 listening:{word:'beautiful',question:'Pilih arti kata yang kamu dengar.',choices:['Indah','Cepat','Marah','Lapar'],answer:'Indah',reward:70},
 boss:{question:'Boss Challenge: “If I ___ time, I would travel.”',choices:['have','had','has','having'],answer:'had',reward:100}
};
function speakWord(word){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(word);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}}
function answerQuest(n,q,a){
 if(a!==q.answer){document.getElementById('modalText').innerHTML='<span class="bad">❌ Jawaban belum tepat. Coba lagi!</span>';return}
 data.quests[n.id]=true;data.done++;data.potions+=1;addReward(q.reward,25, n.q==='boss'?1:0);
 document.getElementById('modalTitle').textContent='🏆 Quest Complete!';
 document.getElementById('modalText').innerHTML='<span class="good">Benar! +' + q.reward + ' XP +25 Coins +1 Potion.</span>';
 document.getElementById('choices').innerHTML='<button onclick="closeModal()">Lanjut menjelajah 🌎</button>';
 document.getElementById('modalClose').style.display='none';
 if(data.done>=5){data.gems+=3}
 save();updateMainQuest();
}
function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('modalClose').style.display='inline-block'}
function updateMainQuest(){let next=npcs.find(n=>!data.quests[n.id]);if(next){document.getElementById('questTitle').textContent='🗺️ Main Quest • '+data.done+'/5';document.getElementById('questSub').textContent='Temui '+next.name+' di '+next.role+'.'}else{document.getElementById('questTitle').textContent='👑 Language Valley Master';document.getElementById('questSub').textContent='Semua quest utama selesai! Jelajahi dunia.'}}
updateMainQuest();

function toggleInventory(){let e=document.getElementById('inventory');e.style.display=e.style.display==='block'?'none':'block'}
function showHelp(){document.getElementById('dialogTitle').textContent='🎮 Cara Bermain';document.getElementById('dialogText').innerHTML='<b>Gerak:</b> WASD / Arrow Keys<br><b>Interaksi:</b> Dekati NPC lalu tekan E / Enter<br><b>Quest:</b> Setiap NPC punya tantangan bahasa berbeda.<br><b>Progress:</b> XP, coins, potion, gem, quest dan level tersimpan otomatis di browser.<br><br>Jelajahi semua area untuk membuka 5 quest utama.';document.getElementById('dialogAction').style.display='none';document.getElementById('dialog').style.display='flex'}
function resetGame(){if(confirm('Reset semua progress game?')){localStorage.removeItem('LQ_OPEN_WORLD');location.reload()}}

function blocked(nx,ny){
 if(nx<30||ny<100||nx>world.w-30||ny>world.h-30)return true;
 for(const b of buildings){if(nx>b.x-b.w/2-20&&nx<b.x+b.w/2+20&&ny>b.y-b.h/2-20&&ny<b.y+b.h/2+20)return true}
 for(const t of trees){if(Math.hypot(nx-t.x,ny-t.y)<28)return true}
 return false
}
function move(){let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=player.x+dx*player.speed,ny=player.y+dy*player.speed;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny}}

function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x-cam.x),Math.round(y-cam.y),w,h)}
function label(t,x,y,size,col='#fff'){ctx.font='bold '+size+'px monospace';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(t,Math.round(x-cam.x),Math.round(y-cam.y))}
function drawTree(t){rect(t.x-7,t.y+8,14,25,'#68442c');ctx.fillStyle='#285b39';ctx.beginPath();ctx.arc(t.x-cam.x,t.y-cam.y,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3c7b46';ctx.beginPath();ctx.arc(t.x-11-cam.x,t.y-9-cam.y,15,0,Math.PI*2);ctx.fill()}
function drawBuilding(b){rect(b.x-b.w/2,b.y-b.h/2,b.w,b.h,b.color);rect(b.x-b.w/2-5,b.y-b.h/2-18,b.w+10,28,'#4b3528');label(b.name,b.x,b.y-b.h/2-2,13);rect(b.x-25,b.y+b.h/2-45,50,45,'#30251f')}
function drawChar(o,color,emoji,name){rect(o.x-16,o.y-2,32,30,color);rect(o.x-12,o.y-32,24,26,'#f2c7a5');ctx.fillStyle='#3f2a22';ctx.fillRect(o.x-13-cam.x,o.y-39-cam.y,26,10);label(emoji,o.x,o.y-9,15);label(name,o.x,o.y+45,9)}
function draw(){
 ctx.fillStyle='#75a85c';ctx.fillRect(0,0,W,H);
 for(let y=0;y<world.h;y+=32)for(let x=0;x<world.w;x+=32){ctx.fillStyle=((x/32+y/32)%2?'#75a65b':'#7aaa61');ctx.fillRect(x-cam.x,y-cam.y,32,32)}
 // river
 ctx.fillStyle='#4f93b9';ctx.fillRect(0-cam.x,0-cam.y,world.w,85);
 // main roads
 ctx.fillStyle='#c9a76c';ctx.fillRect(0-cam.x,790-cam.y,world.w,105);ctx.fillRect(1120-cam.x,85-cam.y,105,world.h);
 buildings.forEach(drawBuilding);trees.forEach(drawTree);rocks.forEach(r=>{ctx.fillStyle='#64748b';ctx.beginPath();ctx.arc(r.x-cam.x,r.y-cam.y,9,0,Math.PI*2);ctx.fill()});
 npcs.forEach(n=>drawChar(n,n.color,n.emoji,n.name));drawChar(player,'#7c3aed','🧑','You');
 const n=nearestNPC();if(n){label('E',n.x,n.y-65,15,'#fde68a');label('Interact',n.x,n.y-47,9)}
}
function loop(){move();cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
